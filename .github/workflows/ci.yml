name: ci

# Vérifications de chaque pull request : aucun secret nécessaire.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ASTRO_TELEMETRY_DISABLED: "1"
  WRANGLER_SEND_METRICS: "false"

jobs:
  ci:
    name: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Installation
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build et dry-run — staging
        run: |
          CLOUDFLARE_ENV=staging npm run build
          npx wrangler deploy --dry-run --env staging | tee "$RUNNER_TEMP/dry-run-staging.txt"
          scripts/check-bundle-size.sh "$RUNNER_TEMP/dry-run-staging.txt"

      # Sur le build staging : pages prérendues (h1, images, liens),
      # redirections 301 et bundle du Worker (mode de migration EmDash).
      - name: Tests
        run: npm test

      - name: Build et dry-run — production
        run: |
          CLOUDFLARE_ENV=production npm run build
          npx wrangler deploy --dry-run --env production | tee "$RUNNER_TEMP/dry-run-production.txt"
          scripts/check-bundle-size.sh "$RUNNER_TEMP/dry-run-production.txt"
