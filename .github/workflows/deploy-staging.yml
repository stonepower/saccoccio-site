name: deploy-staging

# Chaque merge sur main déploie staging.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      take_over_lock_id:
        description: >-
          Id du verrou de migration EmDash à reprendre (affiché par l'étape
          « Migrations EmDash »). Laisser vide sinon. Staging uniquement.
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: "1"
  WRANGLER_SEND_METRICS: "false"
  STAGING_URL: https://saccoccio-staging.lcollin.workers.dev

jobs:
  deploy:
    name: deploy (staging)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: staging
      url: https://saccoccio-staging.lcollin.workers.dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Installation
        run: npm ci

      - name: Build (staging)
        run: CLOUDFLARE_ENV=staging npm run build

      # Schéma EmDash (tables options, users, _emdash_*…), appliqué ici et non
      # plus par le Worker (migrations.runtime: "check"). Le script vérifie
      # que la cible est bien la D1 ci-dessous avant toute écriture, et
      # reprend un verrou abandonné (voir scripts/emdash-migrate.mjs).
      - name: Migrations EmDash (staging)
        env:
          EXPECTED_D1_NAME: saccoccio-db-staging
          EXPECTED_D1_ID: cc9d552e-65cf-46b6-af5c-e98426505cc4
          TAKE_OVER_LOCK_ID: ${{ inputs.take_over_lock_id }}
        run: |
          if [ -n "$TAKE_OVER_LOCK_ID" ]; then
            node scripts/emdash-migrate.mjs staging --take-over-lock "$TAKE_OVER_LOCK_ID"
          else
            node scripts/emdash-migrate.mjs staging
          fi

      # Nos propres tables (dossier migrations/).
      - name: Migrations D1 du projet (staging)
        run: npx wrangler d1 migrations apply saccoccio-db-staging --remote --env staging

      - name: Déploiement (staging)
        run: npx wrangler deploy --env staging

      - name: Vérification des migrations EmDash (staging)
        run: npx emdash migrate --check --wrangler-config wrangler.jsonc --wrangler-env staging

      - name: Smoke test
        run: scripts/smoke-test.sh "$STAGING_URL" staging
