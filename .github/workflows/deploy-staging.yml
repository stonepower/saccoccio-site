name: deploy-staging

# Chaque merge sur main déploie staging.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: "1"
  WRANGLER_SEND_METRICS: "false"
  STAGING_URL: https://saccoccio-staging.lcollin.workers.dev

jobs:
  deploy:
    name: deploy (staging)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: staging
      url: https://saccoccio-staging.lcollin.workers.dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Installation
        run: npm ci

      - name: Build (staging)
        run: CLOUDFLARE_ENV=staging npm run build

      - name: Migrations D1 (staging)
        run: npx wrangler d1 migrations apply saccoccio-db-staging --remote --env staging

      - name: Déploiement (staging)
        run: npx wrangler deploy --env staging

      - name: Smoke test
        run: scripts/smoke-test.sh "$STAGING_URL" staging
