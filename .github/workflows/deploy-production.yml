name: deploy-production

# Un tag v* (ou un lancement manuel SUR UN TAG v*) déploie la production.
# Le garde-fou est l'environnement GitHub « production » : déployable
# uniquement depuis des tags v*, avec approbation obligatoire de stonepower.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: "1"
  WRANGLER_SEND_METRICS: "false"
  PRODUCTION_URL: https://saccoccio-prod.lcollin.workers.dev

jobs:
  deploy:
    name: deploy (production)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production
      url: https://saccoccio-prod.lcollin.workers.dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Vérification de la référence
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ] || [[ "$GITHUB_REF_NAME" != v* ]]; then
            echo "::error::La production se déploie uniquement depuis un tag v* (référence actuelle : $GITHUB_REF)."
            exit 1
          fi

      - name: Vérification du secret de chiffrement des sauvegardes
        env:
          D1_BACKUP_PASSPHRASE: ${{ secrets.D1_BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$D1_BACKUP_PASSPHRASE" ]; then
            echo "::error::Secret D1_BACKUP_PASSPHRASE absent de l'environnement production : la sauvegarde ne peut pas être chiffrée. Rien n'a été modifié."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Installation
        run: npm ci

      - name: Build (production)
        run: CLOUDFLARE_ENV=production npm run build

      # Le dépôt est public : les artefacts sont téléchargeables par tout
      # compte GitHub. La sauvegarde est donc chiffrée (GPG, AES-256) avec
      # D1_BACKUP_PASSPHRASE avant l'upload.
      - name: Sauvegarde de la D1 de production
        id: backup
        env:
          D1_BACKUP_PASSPHRASE: ${{ secrets.D1_BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077
          dir="$RUNNER_TEMP/d1-backup"
          mkdir -p "$dir"
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          name="saccoccio-db-prod-${GITHUB_REF_NAME}-${stamp}"

          # Signet Time Travel (restauration possible sans artefact,
          # dans la fenêtre de rétention de D1).
          npx wrangler d1 time-travel info saccoccio-db-prod --env production | tee "$dir/$name.time-travel.txt" || true

          tables="$(npx wrangler d1 execute saccoccio-db-prod --remote --env production --json \
            --command "SELECT count(*) AS n FROM sqlite_master WHERE type = 'table'" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s)[0].results[0].n))')"
          echo "Tables dans saccoccio-db-prod : $tables"

          if [ "$tables" = "0" ]; then
            echo "::notice::Base de production vide (premier déploiement) : rien à sauvegarder."
          else
            # EmDash utilise des tables virtuelles FTS5 : l'export au format D1
            # est refusé, on exporte au format de « sqlite3 .dump ».
            npx wrangler d1 export saccoccio-db-prod --remote --env production \
              --compatibility sqlite3_cli_only --skip-confirmation \
              --output "$dir/$name.sql"
            gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 \
              --symmetric --cipher-algo AES256 \
              --output "$dir/$name.sql.gpg" "$dir/$name.sql" 3<<<"$D1_BACKUP_PASSPHRASE"
            shred -u "$dir/$name.sql"
          fi
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Upload de la sauvegarde (chiffrée)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.backup.outputs.name }}
          path: ${{ steps.backup.outputs.dir }}
          retention-days: 30
          if-no-files-found: error

      # Schéma EmDash, après la sauvegarde ci-dessus. Le script vérifie que
      # la cible est bien la D1 de production avant toute écriture. En
      # production, un verrou de migration n'est JAMAIS repris : le job
      # échoue avec l'id du verrou (voir CLAUDE.md).
      - name: Migrations EmDash (production)
        env:
          EXPECTED_D1_NAME: saccoccio-db-prod
          EXPECTED_D1_ID: 32fd88c5-38e1-4498-97bc-661dd4c1a3f6
        run: node scripts/emdash-migrate.mjs production

      # Nos propres tables (dossier migrations/).
      - name: Migrations D1 du projet (production)
        run: npx wrangler d1 migrations apply saccoccio-db-prod --remote --env production

      - name: Déploiement (production)
        run: npx wrangler deploy --env production

      - name: Vérification des migrations EmDash (production)
        run: npx emdash migrate --check --wrangler-config wrangler.jsonc --wrangler-env production

      - name: Smoke test
        run: scripts/smoke-test.sh "$PRODUCTION_URL" production
